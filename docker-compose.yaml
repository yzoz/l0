services:
  rabbitmq:
    image: rabbitmq:management
    container_name: rabbit
    hostname: rabbit
    ports:
      - "127.0.0.1:5672:5672"
      - "15672:15672"

  mongodb:
    image: mongo:latest
    container_name: mongo
    hostname: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    #  - ./mongo.conf:/etc/mongo.conf
    #command: mongod --config /etc/mongo.conf
    #deploy:
    #  resources:
    #    limits:
    #      cpus: '16.0'
    #      memory: 64G
    environment:
      - MONGO_INITDB_DATABASE=feo
    restart: unless-stopped

  keydb:
    image: eqalpha/keydb:latest
    command: keydb-server /etc/keydb/keydb.conf --server-threads 2 --bind 0.0.0.0
    container_name: keydb
    hostname: keydb
    ports:
      - "6379:6379"
volumes:
  mongodb_data:
