services:
  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: rabbit
    hostname: rabbit
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

  mongodb:
    image: mongo:8.0
    container_name: mongo
    hostname: mongo
    ports:
      - "127.0.0.1:27017:27017"

  redis:
    image: redis:7.4
    container_name: redis
    hostname: redis
    ports:
      - "127.0.0.1:6379:6379"

  memgraph:
    image: memgraph/memgraph:3.3
    container_name: memgraph
    hostname: memgraph
    ports:
      - "127.0.0.1:7687:7687"

  memlab:
    image: memgraph/lab:3.5
    container_name: memlab
    hostname: memlab
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - MEMGRAPH_HOST=memgraph
      - MEMGRAPH_PORT=7687
    depends_on:
      - memgraph

  influxdb2:
    image: influxdb:2.7.11
    container_name: influx
    hostname: influx
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME:?Set INFLUXDB_USERNAME in .env}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:?Set INFLUXDB_PASSWORD in .env}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:?Set INFLUXDB_TOKEN in .env}
      DOCKER_INFLUXDB_INIT_ORG: feonyx
      DOCKER_INFLUXDB_INIT_BUCKET: stat
    volumes:
      - type: volume
        source: influxdb2-data
        target: /var/lib/influxdb2
      - type: volume
        source: influxdb2-config
        target: /etc/influxdb2
volumes:
  influxdb2-data:
  influxdb2-config:
