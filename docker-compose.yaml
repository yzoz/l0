services:
  rabbitmq:
    image: rabbitmq:management
    container_name: rabbit
    hostname: rabbit
    ports:
      - "127.0.0.1:5672:5672"
      - "15672:15672"

  mongodb:
    image: mongo:latest
    container_name: mongo
    hostname: mongo
    ports:
      - "27017:27017"

  keydb:
    image: eqalpha/keydb:latest
    command: keydb-server /etc/keydb/keydb.conf --server-threads 10 --bind 0.0.0.0
    container_name: keydb
    hostname: keydb
    ports:
      - "6379:6379"
