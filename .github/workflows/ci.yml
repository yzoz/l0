name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: snok/install-poetry@v1
        with:
          version: 2.1.2
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Run unit tests
        run: poetry run pytest
