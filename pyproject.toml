[project]
name = "l0-python"
version = "0.1.0"
description = ""
package-mode = false
authors = [
    {name = "YZoZ",email = "mail@yzoz.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi[standard] (>=0.115.11,<0.116.0)",
    "pynacl (>=1.5.0,<2.0.0)",
    "base58 (>=2.1.1,<3.0.0)",
    "strawberry-graphql[fastapi] (>=0.262.1,<0.263.0)",
    "motor (>=3.7.0,<4.0.0)",
    "aio-pika (>=9.5.5,<10.0.0)",
    "pika (>=1.3.2,<2.0.0)",
    "pymongo (>=4.11.2,<5.0.0)"
]

[tool.poetry.scripts]
fast = "api:app"
txg = "python ./tx_generator.py"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
