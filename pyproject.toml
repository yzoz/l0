[project]
name = "l0-python"
version = "0.1.0"
description = "DAG-based transaction ledger prototype with a FastAPI and GraphQL API."
authors = [
    {name = "YZoZ",email = "mail@yzoz.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi[standard] (>=0.115.11,<0.116.0)",
    "pynacl (>=1.5.0,<2.0.0)",
    "base58 (>=2.1.1,<3.0.0)",
    "strawberry-graphql[fastapi] (>=0.262.1,<0.263.0)",
    "aio-pika (>=9.5.5,<10.0.0)",
    "pymongo (>=4.11.2,<5.0.0)",
    "redis[hiredis] (>=5.2.1,<6.0.0)",
    "neo4j (>=5.28.1,<6.0.0)",
    "tenacity (>=9.1.2,<10.0.0)"
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.26.0"
fakeredis = "^2.23"
networkx = "^3.4.2"
watchfiles = "^1.0.5"
watchdog = {extras = ["watchmedo"], version = "^6.0.0"}
ruff = "^0.17.0"
pytest-cov = "^7.1.0"

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
addopts = "-m 'not integration' --cov=src --cov=service --cov-report=term-missing"
markers = [
    "integration: requires external services such as MongoDB and Redis",
]

[tool.coverage.run]
source = ["src", "service"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.poetry.scripts]
txg = "tx_bot:main"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["env", ".venv", "utils"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = [
    "B008",  # FastAPI: Depends(...) в значениях по умолчанию — это норма
]

[tool.ruff.lint.per-file-ignores]
"keys.py" = ["E501"]  # длинные строки с ключами

[tool.ruff.format]
quote-style = "double"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
